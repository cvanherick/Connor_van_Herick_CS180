<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Becoming Friends with Your Camera">
    <title>Becoming Friends with Your Camera | CS 180 Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="../../">CS 180</a>
      <nav class="nav" aria-label="Primary navigation">
        <a href="../../#projects">Projects</a>
        <a href="../../#about">About</a>
        <a href="../../#contact">Contact</a>
      </nav>
    </header>

    <main>
      <section class="project-hero">
        <p class="eyebrow">Project 1</p>
        <h1>Becoming Friends with Your Camera</h1>
      </section>

      <section class="section project-section" aria-labelledby="selfie-title">
        <div class="section-heading">
          <p class="eyebrow">Part 1</p>
          <h2 id="selfie-title">Selfie</h2>
        </div>
        <div class="media-pair">
          <figure class="media-slot">
            <img src="../../assets/project1/selfie/close-up.jpeg" alt="Close-up selfie portrait">
          </figure>
          <figure class="media-slot">
            <img src="../../assets/project1/selfie/step-back-zoom.jpeg" alt="Portrait taken from farther back with zoom">
          </figure>
        </div>
      </section>

      <section class="section project-section" aria-labelledby="architecture-title">
        <div class="section-heading">
          <p class="eyebrow">Part 2</p>
          <h2 id="architecture-title">Architecture</h2>
        </div>
        <div class="media-pair">
          <figure class="media-slot">
            <img src="../../assets/project1/architecture/zoomed.jpeg" alt="Zoomed architectural photo">
          </figure>
          <figure class="media-slot">
            <img src="../../assets/project1/architecture/walked-forward.jpeg" alt="Architectural photo taken after walking forward">
          </figure>
        </div>
      </section>

      <section class="section project-section" aria-labelledby="dolly-title">
        <div class="section-heading">
          <p class="eyebrow">Part 3</p>
          <h2 id="dolly-title">Dolly Zoom</h2>
        </div>
        <figure class="media-slot media-slot-wide">
          <img src="../../assets/project1/dolly-zoom/photos-0.4s.gif" alt="Dolly zoom animated GIF">
        </figure>
      </section>
    </main>
  </body>
</html>
